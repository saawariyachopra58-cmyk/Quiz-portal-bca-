<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Online Quiz Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="theme-toggle">
  <button onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<!-- Home Page -->
<div class="container" id="home">
  <h1>Online Quiz Portal</h1>
  <p>This project is developed as a BCA final year project to test basic computer knowledge using MCQ-based quizzes.</p>
  <button class="btn" onclick="startQuiz()">Start Quiz</button>
</div>

<!-- Quiz Page -->
<div class="container hidden" id="quiz">
  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <div class="timer">Time Left: <span id="time">15</span>s</div>

  <h2 id="question"></h2>
  <div id="options"></div>
  <p id="feedback"></p>
</div>

<!-- Result Page -->
<div class="container hidden" id="result">
  <h2>Quiz Result</h2>
  <p id="scoreText"></p>
  <p id="performance"></p>
  <button class="btn" onclick="restartQuiz()">Restart Quiz</button>
</div>

<script src="script.js"></script>
</body>
</html>
